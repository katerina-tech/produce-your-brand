[project]
name = "produce-your-stuff-backend"
version = "0.1.0"
description = "AI-powered B2B sourcing and production orchestration - agent API"
requires-python = ">=3.12,<3.15"

# All runtime dependencies are pinned exactly. uv.lock is committed.
# Rationale: the previous project was criticised for loosely pinned deps (>=).
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "langchain-core==1.6.0",
    "langchain-openai==1.6.0",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "faiss-cpu==1.15.0",
    "numpy==2.5.2",
    "pyyaml==6.0.3",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "fastembed==0.8.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.4",
    "mypy==2.3.1",
    "types-pyyaml==6.0.12.20260815",
]

# uv places the virtualenv inside the project, which here sits in a synced
# OneDrive folder. OneDrive refuses hardlinks into synced paths
# ("os error 396"), so copy the wheels instead of linking them.
[tool.uv]
link-mode = "copy"
# The app is run from this directory (uvicorn app.main:app), so it never needs
# installing into the venv. Skipping that also avoids uv rebuilding and
# reinstalling the package on every invocation, which OneDrive intermittently
# blocks with a file lock.
package = false

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "PTH", "T20"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
# Every graph node takes (state, deps) so workflow.bind() can wire them
# identically. Purely deterministic nodes legitimately ignore deps.
"app/graph/nodes.py" = ["ARG001"]
# Homoglyphs and invisible characters are the subject matter here: the guard
# folds them and the tests attack with them. Flagging them as "ambiguous" is
# exactly backwards.
"app/security/guard.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_security.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/*" = ["T201"]  # scripts may print

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["faiss.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]
